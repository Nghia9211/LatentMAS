# Separate profiling protocol; does not alter configs/latent_mas.yaml.
model_name: Qwen/Qwen3-4B
model_revision: null  # Resolve/pin the currently cached snapshot before loading.
task: medqa
method: latent_mas
num_agents: 2
prompt: sequential
think: false
latent_space_realign: true
latent_only: false
sequential_info_only: false
temperature: 0.0
top_p: 0.95
max_new_tokens: 4096
latent_steps: 80
checkpoints: [10, 20, 30, 40, 50, 60, 70, 80]
seed: 42
generate_bs: 1
pilot_samples: 32
data_dir: data/medqa_usmle_4options
split: train
use_vllm: true
use_second_HF_model: true
vllm_dtype: bfloat16
worker_extension_cls: controller.profile.ProfileWorkerInspector
enable_prefix_caching: true
reset_cache_before_each_b: true # Independent labels, no prior-branch cache benefit.
gpu_memory_utilization: 0.3
tensor_parallel_size: 1
device: cuda:0
device2: cuda:0
capture: all_layer_every_step
phi_schema: phi4_checkpoint_v1
parity_samples: 2
parity_checkpoints: [10, 20, 40, 80]
